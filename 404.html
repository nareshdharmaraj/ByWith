<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - ByWith</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50 text-slate-900 h-screen flex flex-col transition-colors duration-300">

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="text-center">
            <h1 class="text-9xl font-bold text-indigo-100 dark:text-slate-800">404</h1>
            <div class="relative -mt-12">
                <h2 class="text-3xl font-bold mb-4 text-slate-800 dark:text-white">Page Not Found</h2>
                <p class="text-slate-500 mb-8 max-w-md mx-auto">Oops! The page you are looking for has been moved or
                    deleted.</p>
                <a href="index.html"
                    class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-full font-bold transition shadow-lg shadow-indigo-500/30">
                    <i class="fas fa-home"></i> Go Back Home
                </a>
            </div>
        </div>
    </main>

    <script src="./js/rtl-toggle.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
