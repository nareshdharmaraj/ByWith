<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - ByWith</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-900 text-white flex items-center justify-center h-screen overflow-hidden relative">

    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80"
            alt="Background" class="w-full h-full object-cover opacity-20">
    </div>

    <div class="relative z-10 text-center max-w-2xl px-4 animate-fade-in-up">
        <div
            class="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center text-4xl font-bold mx-auto mb-8 shadow-2xl shadow-indigo-500/50">
            B</div>
        <h1 class="text-5xl md:text-6xl font-bold mb-4">Something Amazing is Coming</h1>
        <p class="text-xl text-slate-300 mb-8">We are building something extraordinary. Stay tuned for the big reveal.
        </p>

        <div class="flex justify-center gap-4 mb-12">
            <div class="text-center">
                <div class="text-4xl font-bold text-indigo-400">05</div>
                <div class="text-xs uppercase tracking-widest text-slate-500 mt-1">Days</div>
            </div>
            <div class="text-center px-4"><span class="text-4xl">:</span></div>
            <div class="text-center">
                <div class="text-4xl font-bold text-indigo-400">12</div>
                <div class="text-xs uppercase tracking-widest text-slate-500 mt-1">Hours</div>
            </div>
            <div class="text-center px-4"><span class="text-4xl">:</span></div>
            <div class="text-center">
                <div class="text-4xl font-bold text-indigo-400">45</div>
                <div class="text-xs uppercase tracking-widest text-slate-500 mt-1">Mins</div>
            </div>
        </div>

        <form class="flex max-w-md mx-auto">
            <input type="email" placeholder="Enter your email"
                class="flex-1 px-4 py-3 rounded-l-lg bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 backdrop-blur-sm">
            <button
                class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-r-lg transition">Notify
                Me</button>
        </form>
    </div>

</body>

</html>
